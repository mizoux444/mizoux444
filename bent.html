<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>beIN ENT</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;}
video{width:100%;height:100%;object-fit:fill;display:block;background:#000;}
#name{position:fixed;top:0;left:0;right:0;padding:10px 16px;background:linear-gradient(#000a,transparent);color:#fff;font-size:15px;font-family:Arial;font-weight:bold;z-index:10;}
#err{display:none;position:fixed;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#fff;font-size:15px;font-family:Arial;background:#000;}
#err.show{display:flex;}
</style>
</head>
<body>
<div id="name"></div>
<video id="v" autoplay playsinline controls></video>
<div id="err"><span>تعذّر تحميل البث</span></div>
<script>
const v=document.getElementById('v');
const params=new URLSearchParams(location.search);
const url=params.get('url')||'';
const name=params.get('name')||'';
document.getElementById('name').textContent=name;
document.title=name||'beIN ENT';

if(url){
  if(Hls.isSupported()){
    const hls=new Hls({
      enableWorker:true,
      lowLatencyMode:true,
      xhrSetup:function(xhr){
        xhr.setRequestHeader('User-Agent','Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36');
        xhr.setRequestHeader('Referer','https://x.com/');
      }
    });
    hls.loadSource(url);
    hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{v.play().catch(()=>{});});
    hls.on(Hls.Events.ERROR,(_,d)=>{
      if(d.fatal) document.getElementById('err').classList.add('show');
    });
  } else if(v.canPlayType('application/vnd.apple.mpegurl')){
    v.src=url;
    v.play().catch(()=>{});
  }
}
</script>
</body>
</html>
