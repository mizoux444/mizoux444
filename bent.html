<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;}
video{width:100%;height:100%;object-fit:fill;display:block;background:#000;}
#err{display:none;position:absolute;inset:0;align-items:center;justify-content:center;color:#fff;font-size:14px;font-family:Arial;background:rgba(0,0,0,0.7);}
#err.show{display:flex;}
</style>
</head>
<body>
<video id="v" autoplay playsinline controls></video>
<div id="err"></div>
<script>
const v=document.getElementById('v');
let hls=null;

function playBent(url){
  if(hls){hls.destroy();hls=null;}
  document.getElementById('err').classList.remove('show');
  if(Hls.isSupported()){
    hls=new Hls({
      enableWorker:true,
      lowLatencyMode:true,
      xhrSetup:function(xhr){
        xhr.setRequestHeader('User-Agent','Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36');
        xhr.setRequestHeader('Referer','https://x.com/');
      }
    });
    hls.loadSource(url);
    hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{v.play().catch(()=>{});});
    hls.on(Hls.Events.ERROR,(_,d)=>{
      if(d.fatal){
        const e=document.getElementById('err');
        e.textContent='تعذّر تحميل البث';
        e.classList.add('show');
      }
    });
  } else if(v.canPlayType('application/vnd.apple.mpegurl')){
    v.src=url;
    v.play().catch(()=>{});
  }
}

// استقبال الرابط من التطبيق الرئيسي
window.addEventListener('message',function(e){
  if(e.data && e.data.url) playBent(e.data.url);
});
</script>
</body>
</html>
